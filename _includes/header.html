<header>
    <nav>
        <div class="logo"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></div>
        <div class="hamburger" aria-label="Menü öffnen" role="button" tabindex="0">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <ul class="nav-links">
            {% for item in site.navigation %}
            <li>
                <a href="{{ item.url | relative_url }}" {% if page.url == item.url or page.url == item.url | append: '/' %}class="active"{% endif %}>
                    {{ item.title }}
                </a>
            </li>
            {% endfor %}
        </ul>
    </nav>
</header>
