<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title and page.url != '/' %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }} - Edle & Moderne Zucht{% endif %}</title>
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <meta name="robots" content="noimageindex">
    <meta name="googlebot" content="noimageindex">
    <link rel="stylesheet" href="{{ '/css/styles.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body data-poodle-paws>

    {% include header.html %}

    {{ content }}

    {% include footer.html %}

    <script src="{{ '/js/poodle-paws.js' | relative_url }}"></script>
    <script src="{{ '/js/script.js' | relative_url }}"></script>
</body>
</html>
